server {
    listen 80;
    listen [::]:80;
    server_name moyu.pdcat.cn 49.51.188.128;

    client_max_body_size 2m;

    # Homestead snapshots are JSON-heavy. Nginx's default gzip MIME list does
    # not include application/json, so declare it explicitly for both the API
    # and the browser's follow-up reads.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1k;
    gzip_types application/json text/plain text/css application/javascript text/javascript application/xml image/svg+xml;

    location = /healthz {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        access_log off;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
