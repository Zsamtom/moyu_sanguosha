services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sanguosha
      POSTGRES_USER: sanguosha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sanguosha_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanguosha -d sanguosha"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: sanguosha-online-app:${APP_VERSION:-dev}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        BUILD_SHA: ${BUILD_SHA:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://sanguosha:${POSTGRES_PASSWORD}@db:5432/sanguosha
      SESSION_SECRET: ${SESSION_SECRET}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      INITIAL_ADMIN_DISPLAY_NAME: ${INITIAL_ADMIN_DISPLAY_NAME:-管理员}
      APP_ORIGIN: ${APP_ORIGIN}
    ports:
      - "127.0.0.1:3100:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  sanguosha_db:
