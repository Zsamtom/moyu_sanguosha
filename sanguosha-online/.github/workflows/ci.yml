name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sanguosha_test
          POSTGRES_USER: sanguosha
          POSTGRES_PASSWORD: sanguosha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanguosha -d sanguosha_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @sanguosha/server test:integration
        env:
          TEST_DATABASE_URL: postgresql://sanguosha:sanguosha_test@127.0.0.1:5432/sanguosha_test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:ci
      - run: pnpm audit --prod --audit-level=high
